<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/manifest.json">    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vijay's Chatbot</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #ffffff;
    --sidebar: #f7f7f8;
    --border: #e5e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --user: #2563eb;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
}

body {
    display: flex;
    overflow: hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 270px;
    height: 100vh;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 14px;
    flex-shrink: 0;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 8px 18px;
}

.brand-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    display: grid;
    place-items: center;
    font-weight: 700;
}

.brand-name {
    font-size: 17px;
    font-weight: 650;
}

.new-chat {
    width: 100%;
    border: 1px solid var(--border);
    background: white;
    color: var(--text);
    border-radius: 9px;
    padding: 11px 13px;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
}

.new-chat:hover {
    background: #f0f1f3;
}

.search {
    margin: 14px 0;
}

.search input {
    width: 100%;
    border: 1px solid var(--border);
    background: white;
    border-radius: 9px;
    outline: none;
    padding: 9px 10px;
    font-size: 13px;
}

.section-title {
    font-size: 11px;
    font-weight: 650;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 7px 8px;
}

.history {
    overflow-y: auto;
}

.history-item {
    padding: 9px 10px;
    border-radius: 8px;
    color: #4b5563;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.history-item:hover,
.history-item.active {
    background: #e9eaec;
    color: #111827;
}

.sidebar-bottom {
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding-top: 12px;
}

.profile {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px;
}

.avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #dbeafe;
    color: var(--accent);
    display: grid;
    place-items: center;
    font-weight: 700;
}

.profile-name {
    font-size: 13px;
    font-weight: 600;
}

.profile-status {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    min-width: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 58px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 22px;
}

.top-title {
    font-size: 15px;
    font-weight: 600;
}

.top-subtitle {
    color: var(--muted);
    font-size: 11px;
    margin-top: 2px;
}

/* =========================
   CHAT
========================= */

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 32px 20px 150px;
}

.chat-inner {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
}

/* =========================
   WELCOME
========================= */

.welcome {
    max-width: 700px;
    margin: 9vh auto 0;
    text-align: center;
}

.welcome-icon {
    width: 58px;
    height: 58px;
    margin: 0 auto 18px;
    border-radius: 17px;
    background: #eff6ff;
    color: var(--accent);
    display: grid;
    place-items: center;
    font-size: 27px;
}

.welcome h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 650;
}

.welcome p {
    margin: 10px auto 28px;
    color: var(--muted);
    font-size: 15px;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    text-align: left;
}

.suggestion {
    border: 1px solid var(--border);
    background: white;
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
    transition: .15s;
}

.suggestion:hover {
    border-color: #bfdbfe;
    background: #f8fbff;
}

.suggestion-title {
    font-size: 14px;
    font-weight: 600;
}

.suggestion-text {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
}

/* =========================
   MESSAGES
========================= */

.message-row {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    max-width: 850px;
}

.message-row.user {
    justify-content: flex-end;
}

.message-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex: 0 0 32px;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 700;
}

.bot-avatar {
    background: #eff6ff;
    color: var(--accent);
}

.user-avatar {
    background: #e5e7eb;
    color: #374151;
}

.message-content {
    max-width: 78%;
}

.message-name {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
}

.message-text {
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user .message-text {
    background: var(--user);
    color: white;
    border-radius: 16px 16px 4px 16px;
    padding: 10px 14px;
}

/* =========================
   TYPING
========================= */

.typing {
    display: inline-flex;
    gap: 4px;
    padding: 8px 0;
}

.typing span {
    width: 6px;
    height: 6px;
    background: #9ca3af;
    border-radius: 50%;
    animation: bounce 1.1s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes bounce {
    0%, 60%, 100% {
        transform: translateY(0);
        opacity: .45;
    }

    30% {
        transform: translateY(-4px);
        opacity: 1;
    }
}

/* =========================
   COMPOSER
========================= */

.composer-area {
    position: fixed;
    left: 270px;
    right: 0;
    bottom: 0;
    background: linear-gradient(transparent, white 24%);
    padding: 25px 20px 15px;
    z-index: 5;
}

.composer-wrap {
    max-width: 850px;
    margin: auto;
}

.composer {
    display: flex;
    align-items: flex-end;
    gap: 7px;
    border: 1px solid #d1d5db;
    background: white;
    border-radius: 15px;
    padding: 8px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
}

/* =========================
   AI DROPDOWN
========================= */

.ai-selector {
    flex: 0 0 auto;
}

#aiSelect {
    appearance: auto;
    border: 1px solid #e5e7eb;
    background: #f8f9fa;
    color: #4b5563;
    border-radius: 8px;
    padding: 8px 9px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
    height: 38px;
    max-width: 105px;
}

#aiSelect:hover {
    background: #eef0f2;
    color: #111827;
}

#message {
    flex: 1;
    min-width: 0;
    height: 38px;
    max-height: 130px;
    resize: none;
    border: 0;
    outline: none;
    font: inherit;
    font-size: 14px;
    line-height: 1.45;
    padding: 9px 3px;
}

#message::placeholder {
    color: #9ca3af;
}

.composer-button {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    border: 0;
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    cursor: pointer;
    font-size: 18px;
}

.composer-button:hover {
    background: #f3f4f6;
}

#send {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    cursor: pointer;
    font-size: 18px;
}

#send:hover {
    background: var(--accent-hover);
}

#send:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.footer-note {
    text-align: center;
    color: #9ca3af;
    font-size: 10px;
    margin-top: 7px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 750px) {

    .sidebar {
        display: none;
    }

    .composer-area {
        left: 0;
        padding-left: 12px;
        padding-right: 12px;
    }

    #chat {
        padding-left: 12px;
        padding-right: 12px;
    }

    .suggestions {
        grid-template-columns: 1fr;
    }

    .welcome h1 {
        font-size: 25px;
    }

    .message-content {
        max-width: 85%;
    }

    #aiSelect {
        max-width: 90px;
    }
}
</style>
</head>

<body>

<aside class="sidebar">

    <div class="brand">
        <div class="brand-icon">V</div>
        <div class="brand-name">Vijay's Chatbot</div>
    </div>

    <button class="new-chat" onclick="newChat()">
        ＋ &nbsp; New chat
    </button>

    <div class="search">
        <input
            id="searchInput"
            type="text"
            placeholder="Search chats..."
        >
    </div>

    <div class="section-title">
        Recent chats
    </div>

    <div class="history" id="history">
        <div class="history-item active">
            New conversation
        </div>
    </div>

    <div class="sidebar-bottom">
        <div class="profile">

            <div class="avatar">
                V
            </div>

            <div>
                <div class="profile-name">
                    Vijay
                </div>

                <div class="profile-status">
                    Chatbot ready
                </div>
            </div>

        </div>
    </div>

</aside>


<main class="main">

    <header class="topbar">

        <div>
            <div class="top-title">
                Vijay's Chatbot
            </div>

            <div class="top-subtitle">
                Multi-AI assistant
            </div>
        </div>

    </header>


    <div id="chat">

        <div class="chat-inner" id="chatInner">

            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    ✦
                </div>

                <h1>
                    Hi, I'm Vijay's Chatbot
                </h1>

                <p>
                    Choose an AI below and start chatting.
                </p>

                <div class="suggestions">

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Explain something to me')"
                    >
                        <div class="suggestion-title">
                            💡 Ask me anything
                        </div>

                        <div class="suggestion-text">
                            Get a simple answer to your question.
                        </div>
                    </button>


                    <button
                        class="suggestion"
                        onclick="useSuggestion('Help me with coding')"
                    >
                        <div class="suggestion-title">
                            💻 Help with coding
                        </div>

                        <div class="suggestion-text">
                            Debug, explain, or build code with me.
                        </div>
                    </button>


                    <button
                        class="suggestion"
                        onclick="useSuggestion('Explain this topic in simple words')"
                    >
                        <div class="suggestion-title">
                            📚 Explain something
                        </div>

                        <div class="suggestion-text">
                            Make complicated topics easy.
                        </div>
                    </button>


                    <button
                        class="suggestion"
                        onclick="useSuggestion('Help me write something')"
                    >
                        <div class="suggestion-title">
                            ✍️ Help me write
                        </div>

                        <div class="suggestion-text">
                            Create or improve your writing.
                        </div>
                    </button>

                </div>

            </div>

        </div>

    </div>


    <div class="composer-area">

        <div class="composer-wrap">

            <form
                class="composer"
                id="chat-form"
            >

                <button
                    class="composer-button"
                    type="button"
                    title="Attach file"
                >
                    ＋
                </button>


                <!-- AI SELECTOR -->

                <div class="ai-selector">

                    <select id="aiSelect">

                <option value="gemini">
                 Gemini
                 </option>

                 <option value="groq">
                 Groq
                 </option>

                 <option value="openrouter">
                 OpenRouter
                 </option>

                 </select>
                </div>


                <textarea
                    id="message"
                    placeholder="Message Gemini..."
                    rows="1"
                    autocomplete="off"
                ></textarea>


                <button
                    class="composer-button"
                    type="button"
                    title="Voice input"
                >
                    🎙
                </button>


                <button
                    id="send"
                    type="submit"
                    title="Send"
                >
                    ↑
                </button>

            </form>


            <div class="footer-note">
                AI responses may contain mistakes. Check important information.
            </div>

        </div>

    </div>

</main>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
    "https://vijays-chatbot.onrender.com";


/* =========================================================
   ELEMENTS
========================================================= */

const form =
    document.getElementById("chat-form");

const input =
    document.getElementById("message");

const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const sendButton =
    document.getElementById("send");

const historyElement =
    document.getElementById("history");

const searchInput =
    document.getElementById("searchInput");

const aiSelect =
    document.getElementById("aiSelect");


/* =========================================================
   AI NAMES
========================================================= */

const aiNames = {

    gemini:
        "Gemini",

    groq:
        "Groq",

    openrouter:
        "OpenRouter"

};


/* =========================================================
   CONVERSATION HISTORY
========================================================= */

/*
   IMPORTANT:

   This history belongs to the CHAT,
   NOT to a particular AI.

   Therefore:

   Gemini → Groq → OpenRouter

   all use the same conversation.
*/

let conversationHistory = [];


/* =========================================================
   ATTACHMENTS
========================================================= */

let attachments = [];


/* =========================================================
   CREATE FILE INPUT
========================================================= */

const fileInput =
    document.createElement("input");

fileInput.type = "file";

fileInput.accept =
    "image/*,video/*,.pdf,.txt,.doc,.docx,.csv,.json,.md";

fileInput.multiple = true;

fileInput.style.display = "none";

document.body.appendChild(
    fileInput
);


/* =========================================================
   FIND ATTACH BUTTON
========================================================= */

const attachButton =
    document.querySelector(
        '.composer-button[title="Attach file"]'
    );


/* =========================================================
   ATTACH BUTTON
========================================================= */

if (attachButton) {

    attachButton.addEventListener(
        "click",
        () => {

            fileInput.click();

        }
    );

}


/* =========================================================
   FILE SELECTION
========================================================= */

fileInput.addEventListener(
    "change",
    async function() {

        const files =
            Array.from(
                fileInput.files
            );


        for (const file of files) {

            await uploadFile(file);

        }


        fileInput.value = "";

    }
);


/* =========================================================
   UPLOAD FILE
========================================================= */

async function uploadFile(file) {

    try {

        showUploadMessage(
            `Uploading ${file.name}...`
        );


        const formData =
            new FormData();


        formData.append(
            "file",
            file
        );


        const response =
            await fetch(
                `${API_URL}/upload`,
                {

                    method: "POST",

                    body: formData

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Upload failed."
            );

        }


        attachments.push({

            name:
                data.name,

            mimeType:
                data.mimeType,

            size:
                data.size,

            fileUri:
                data.fileUri,

            fileName:
                data.fileName

        });


        showAttachmentPreview();


        console.log(
            "✅ Uploaded:",
            data.name
        );

    }

    catch (error) {

        console.error(
            "Upload error:",
            error
        );


        alert(
            "Upload failed:\n" +
            error.message
        );

    }

}


/* =========================================================
   UPLOAD STATUS
========================================================= */

function showUploadMessage(text) {

    /*
       Small temporary status.
       It does not become part of the AI conversation.
    */

    let status =
        document.getElementById(
            "upload-status"
        );


    if (!status) {

        status =
            document.createElement(
                "div"
            );

        status.id =
            "upload-status";

        status.style.position =
            "fixed";

        status.style.bottom =
            "95px";

        status.style.left =
            "50%";

        status.style.transform =
            "translateX(-50%)";

        status.style.background =
            "#111827";

        status.style.color =
            "white";

        status.style.padding =
            "8px 13px";

        status.style.borderRadius =
            "8px";

        status.style.fontSize =
            "12px";

        status.style.zIndex =
            "100";

        document.body.appendChild(
            status
        );

    }


    status.textContent =
        text;


    clearTimeout(
        status._timer
    );


    status._timer =
        setTimeout(
            () => {

                status.remove();

            },
            2500
        );

}


/* =========================================================
   ATTACHMENT PREVIEW
========================================================= */

function showAttachmentPreview() {

    let preview =
        document.getElementById(
            "attachment-preview"
        );


    if (!preview) {

        preview =
            document.createElement(
                "div"
            );

        preview.id =
            "attachment-preview";

        preview.style.display =
            "flex";

        preview.style.flexWrap =
            "wrap";

        preview.style.gap =
            "7px";

        preview.style.marginBottom =
            "8px";

        preview.style.maxWidth =
            "850px";

        preview.style.marginLeft =
            "auto";

        preview.style.marginRight =
            "auto";


        const composerArea =
            document.querySelector(
                ".composer-area"
            );

        composerArea.insertBefore(
            preview,
            composerArea.firstElementChild
        );

    }


    preview.innerHTML = "";


    attachments.forEach(
        (file, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.style.display =
                "flex";

            item.style.alignItems =
                "center";

            item.style.gap =
                "7px";

            item.style.background =
                "#f3f4f6";

            item.style.border =
                "1px solid #e5e7eb";

            item.style.borderRadius =
                "9px";

            item.style.padding =
                "6px 9px";

            item.style.fontSize =
                "12px";


            const icon =
                getFileIcon(
                    file.mimeType
                );


            item.innerHTML = `

                <span>
                    ${icon}
                </span>

                <span
                    style="
                        max-width:180px;
                        overflow:hidden;
                        text-overflow:ellipsis;
                        white-space:nowrap;
                    "
                >
                    ${escapeHtml(file.name)}
                </span>

                <button
                    type="button"
                    data-index="${index}"
                    style="
                        border:0;
                        background:transparent;
                        cursor:pointer;
                        font-size:14px;
                    "
                    title="Remove"
                >
                    ×
                </button>

            `;


            item
                .querySelector("button")
                .addEventListener(
                    "click",
                    () => {

                        attachments.splice(
                            index,
                            1
                        );

                        showAttachmentPreview();

                    }
                );


            preview.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   FILE ICON
========================================================= */

function getFileIcon(mime) {

    if (
        mime &&
        mime.startsWith("image/")
    ) {
        return "🖼️";
    }

    if (
        mime &&
        mime.startsWith("video/")
    ) {
        return "🎥";
    }

    if (
        mime === "application/pdf"
    ) {
        return "📕";
    }

    if (
        mime &&
        mime.startsWith("audio/")
    ) {
        return "🎵";
    }

    return "📄";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================================================
   AI SELECTOR
========================================================= */

aiSelect.addEventListener(
    "change",
    function() {

        const selectedAI =
            aiSelect.value;


        input.placeholder =
            "Message " +
            aiNames[selectedAI] +
            "...";


        input.focus();

    }
);


/* =========================================================
   AUTO RESIZE
========================================================= */

function autoResize() {

    input.style.height =
        "38px";


    input.style.height =
        Math.min(
            input.scrollHeight,
            130
        ) + "px";

}


input.addEventListener(
    "input",
    autoResize
);


/* =========================================================
   ENTER TO SEND
========================================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            form.requestSubmit();

        }

    }
);


/* =========================================================
   SUGGESTIONS
========================================================= */

function useSuggestion(text) {

    input.value =
        text;

    autoResize();

    input.focus();

}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat() {

    /*
       THIS is the only thing that
       intentionally clears the conversation.
    */

    conversationHistory = [];

    attachments = [];


    const preview =
        document.getElementById(
            "attachment-preview"
        );


    if (preview) {

        preview.remove();

    }


    chatInner.innerHTML = `

        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-icon">
                ✦
            </div>

            <h1>
                Hi, I'm Vijay's Chatbot
            </h1>

            <p>
                Choose an AI below and start chatting.
            </p>

            <div class="suggestions">

                <button
                    class="suggestion"
                    onclick="useSuggestion(
                        'Explain something to me'
                    )"
                >

                    <div class="suggestion-title">
                        💡 Ask me anything
                    </div>

                    <div class="suggestion-text">
                        Get a simple answer to your question.
                    </div>

                    )"
                >

                    </div>

                    </div>

                <button

    `;

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    text,
    type,
    provider = null,
    attachmentNames = []
) {

    const welcome =
        document.getElementById(
            "welcome"
        );


    if (welcome) {

        welcome.remove();

    }


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row " +
        type;


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "message-avatar " +
        (
            type === "user"
                ? "user-avatar"
                : "bot-avatar"
        );


    avatar.textContent =
        type === "user"
            ? "V"
            : "✦";


    const content =
        document.createElement(
            "div"
        );


    content.className =
        "message-content";


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "message-name";


    if (type === "user") {

        name.textContent =
            "You";

    }

    else {

        name.textContent =
            aiNames[provider] ||
            "AI";

    }


    const textElement =
        document.createElement(
            "div"
        );


    textElement.className =
        "message-text";


    textElement.textContent =
        text;


    content.appendChild(
        name
    );


    /*
       Attachment labels
    */

    if (
        attachmentNames &&
        attachmentNames.length
    ) {

        const files =
            document.createElement(
                "div"
            );


        files.style.fontSize =
            "12px";

        files.style.color =
            type === "user"
                ? "#dbeafe"
                : "#6b7280";

        files.style.marginBottom =
            "6px";


        files.textContent =
            "📎 " +
            attachmentNames.join(
                ", "
            );


        content.appendChild(
            files
        );

    }


    content.appendChild(
        textElement
    );


    if (
        type === "user"
    ) {

        row.appendChild(
            content
        );

        row.appendChild(
            avatar
        );

    }

    else {

        row.appendChild(
            avatar
        );

        row.appendChild(
            content
        );

    }


    chatInner.appendChild(
        row
    );


    chat.scrollTop =
        chat.scrollHeight;


    return row;

}


/* =========================================================
   TYPING INDICATOR
========================================================= */

function addTyping(
    provider
) {

    const welcome =
        document.getElementById(
            "welcome"
        );


    if (welcome) {

        welcome.remove();

    }


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row assistant";


    row.id =
        "typing-message";


    row.innerHTML = `

        <div class="message-avatar bot-avatar">
            ✦
        </div>

        <div class="message-content">

            <div class="message-name">
                ${aiNames[provider] || "AI"}
            </div>

            <div class="message-text">

                <div class="typing">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        </div>

    `;


    chatInner.appendChild(
        row
    );


    chat.scrollTop =
        chat.scrollHeight;


    return row;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const message =
            input.value.trim();


        const provider =
            aiSelect.value;


        /*
           Allow sending files without text.
        */

        if (
            !message &&
            attachments.length === 0
        ) {

            return;

        }


        /*
           Save attachment names
           before clearing them.
        */

        const sentAttachments =
            [...attachments];


        const attachmentNames =
            sentAttachments.map(
                file => file.name
            );


        /*
           Show user's message
        */

        addMessage(

            message ||
            "Attached file(s)",

            "user",

            null,

            attachmentNames

        );


        /*
           Save USER message in shared
           conversation history.
        */

        conversationHistory.push({

            role: "user",

            content:
                message ||
                "[Attached file(s): " +
                attachmentNames.join(
                    ", "
                ) +
                "]"

        });


        /*
           Show typing
        */

        const typing =
            addTyping(
                provider
            );


        /*
           Disable composer
        */

        sendButton.disabled =
            true;

        input.disabled =
            true;


        try {

            /*
               IMPORTANT:

               We send the history BEFORE
               the current assistant response.

               This means the next AI sees
               everything that happened before.
            */

            const response =
                await fetch(
                    `${API_URL}/chat`,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                message,

                                provider,

                                history:
                                    conversationHistory
                                        .slice(
                                            0,
                                            -1
                                        ),

                                attachments:
                                    sentAttachments

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "AI request failed."
                );

            }


            /*
               Remove typing
            */

            if (typing) {

                typing.remove();

            }


            /*
               Add AI response
            */

            addMessage(

                data.reply,

                "assistant",

                provider

            );


            /*
               SAVE AI RESPONSE

               This is the important part.
               It means the next provider sees
               this answer too.
            */

            conversationHistory.push({

                role:
                    "assistant",

                content:
                    data.reply

            });


            /*
               Files have now been sent.

               Keep them available in the current
               UI only until the user sends the
               message.

               They won't accidentally be sent
               again with the next message.
            */

            attachments = [];


            const preview =
                document.getElementById(
                    "attachment-preview"
                );


            if (preview) {

                preview.remove();

            }


        }

        catch (error) {

            console.error(
                "❌ Chat error:",
                error
            );


            if (typing) {

                typing.remove();

            }


            addMessage(

                "Error: " +
                error.message,

                "assistant",

                provider

            );

        }


        finally {

            sendButton.disabled =
                false;

            input.disabled =
                false;

            input.value =
                "";

            autoResize();

            input.focus();

        }

    }
);


/* =========================================================
   SEARCH CHATS
========================================================= */

if (searchInput) {

    searchInput.addEventListener(
        "input",
        function() {

            const query =
                searchInput.value
                    .toLowerCase()
                    .trim();


            const items =
                historyElement
                    .querySelectorAll(
                        ".history-item"
                    );


            items.forEach(
                item => {

                    item.style.display =
                        item.textContent
                            .toLowerCase()
                            .includes(
                                query
                            )
                            ? ""
                            : "none";

                }
            );

        }
    );

}


/* =========================================================
   STARTUP
========================================================= */

input.placeholder =
    "Message Gemini...";

autoResize();

input.focus();

</script>
